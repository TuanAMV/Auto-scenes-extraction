<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>视频处理流水线控制面板</title>
    <style>
        :root {
            --bg-main: #f4f7f8;
            --bg-soft: #ffffff;
            --bg-strong: #0f2f36;
            --text-main: #1b2730;
            --text-muted: #5f7180;
            --line: #d4dfe4;
            --primary: #0f7c8a;
            --primary-strong: #0a6370;
            --success: #1f8f55;
            --danger: #c54848;
            --warning: #d59a23;
            --chip: #e6f2f4;
            --shadow-sm: 0 4px 12px rgba(16, 36, 43, 0.08);
            --shadow-md: 0 10px 28px rgba(16, 36, 43, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            max-width: 1280px;
            margin: 28px auto;
            background: radial-gradient(circle at 10% 0%, #ffffff 0%, #eef4f6 45%, #e6edf0 100%);
            padding: 24px;
            border-radius: 14px;
            box-shadow: var(--shadow-md);
            color: var(--text-main);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 18px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 12px;
            color: #123341;
            font-size: 1.45em;
            letter-spacing: 0.2px;
        }

        .main-container {
            display: flex;
            gap: 22px;
            align-items: flex-start;
        }

        .config-panel { flex: 2; min-width: 0; }

        .control-panel {
            flex: 1;
            min-width: 300px;
            position: sticky;
            top: 20px;
            height: fit-content;
        }

        .panel-card {
            background: linear-gradient(180deg, #fbfdfe 0%, #f3f8fa 100%);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
            box-shadow: var(--shadow-sm);
        }

        .panel-card h3 {
            margin: 0 0 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #d9e5ea;
            color: #2a4451;
            font-size: 0.98em;
        }

        .panel-card h3 .badge {
            font-size: 0.72em;
            padding: 2px 8px;
            border-radius: 999px;
            margin-left: 6px;
            font-weight: 600;
            border: 1px solid transparent;
        }

        .badge-indexer { background: #d8eefd; color: #0d4f70; border-color: #b8dff4; }
        .badge-search { background: #dff2e7; color: #16663f; border-color: #bde2cd; }
        .badge-label { background: #fff3d8; color: #7b5b12; border-color: #f0dfb5; }

        .form-group { margin-bottom: 12px; }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #2a4451;
            font-size: 0.86em;
        }

        .form-group .help-text {
            font-size: 0.76em;
            color: var(--text-muted);
            margin-top: 4px;
            line-height: 1.45;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 0.9em;
            background: #fff;
            color: var(--text-main);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus,
        textarea:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(15, 124, 138, 0.16);
        }

        textarea {
            resize: vertical;
            min-height: 60px;
            font-family: inherit;
        }

        .input-group { display: flex; gap: 8px; align-items: center; }
        .input-group input, .input-group select { flex: 1; min-width: 0; }

        button {
            padding: 8px 14px;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.9em;
            cursor: pointer;
            background-color: var(--primary);
            transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            background-color: var(--primary-strong);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(12, 74, 85, 0.2);
        }

        button:disabled {
            background-color: #c5d0d5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-primary { background-color: var(--primary); }
        .btn-primary:hover { background-color: var(--primary-strong); }
        .btn-success { background-color: var(--success); }
        .btn-success:hover { background-color: #157645; }
        .btn-warning { background-color: var(--warning); color: #2a210f; }
        .btn-warning:hover { background-color: #be8618; }
        .btn-danger { background-color: var(--danger); }
        .btn-danger:hover { background-color: #a93d3d; }
        .btn-secondary { background-color: #415c67; }
        .btn-secondary:hover { background-color: #334a53; }

        .btn-outline {
            background: #fff;
            border: 1px solid #b9ccd4;
            color: #2a4451;
        }

        .btn-outline:hover {
            background: var(--chip);
            color: #1f4e5a;
            border-color: #9ec0cb;
        }

        .browse-btn {
            width: auto;
            flex: 0 0 auto;
            padding: 0 12px;
            height: 34px;
            border: 1px solid #b9ccd4;
            background-color: #edf4f6;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            color: #2a4451;
            font-size: 0.84em;
            line-height: 1;
            box-shadow: none;
        }

        .browse-btn:hover {
            background-color: #e2eef2;
            transform: none;
            box-shadow: none;
        }

        .toggle-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }

        .toggle-row input[type="checkbox"],
        .toggle-row input[type="radio"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .toggle-row label { cursor: pointer; font-weight: 500; font-size: 0.85em; }

        .slider-group {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 10px;
        }

        .slider-group input[type="range"] { width: 100%; accent-color: var(--primary); }

        .slider-group .slider-value {
            min-width: 42px;
            text-align: right;
            font-weight: 600;
            color: var(--primary);
            font-size: 0.85em;
        }

        .collapsible-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            padding: 8px 0;
            border-bottom: 1px solid #d9e5ea;
            margin-bottom: 10px;
            color: #304d59;
        }

        .collapsible-header:hover { color: var(--primary); }
        .collapsible-header .toggle-icon { font-size: 0.78em; transition: transform 0.2s ease; }
        .collapsible-header.collapsed .toggle-icon { transform: rotate(-90deg); }
        .collapsible-content { transition: all 0.25s ease; }
        .collapsible-content.collapsed { display: none; }

        .section-divider { border: none; border-top: 1px dashed #c7d6dc; margin: 14px 0; }

        .status-box {
            padding: 12px;
            background-color: #ebf3f6;
            border: 1px solid #dbe8ed;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            min-height: 40px;
            margin-top: 12px;
            font-size: 0.86em;
            color: #2f4d59;
        }

        .status-box.running { background-color: #fff6db; color: #74520f; border-color: #f2e2ac; }
        .status-box.success { background-color: #dff2e7; color: #16663f; border-color: #bde2cd; }
        .status-box.error { background-color: #f8e0e0; color: #8d2d2d; border-color: #efc4c4; }

        .log-container {
            background: #11252c;
            color: #d4dde1;
            border-radius: 8px;
            padding: 10px;
            font-family: "Consolas", "Monaco", monospace;
            font-size: 0.8em;
            max-height: 320px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            border: 1px solid #1e3a44;
        }

        .log-container .log-info { color: #6fcde8; }
        .log-container .log-success { color: #8fdba8; }
        .log-container .log-warning { color: #f2c77a; }
        .log-container .log-error { color: #f09696; }
        .log-container .log-time { color: #8da2ab; }

        .progress-bar {
            height: 6px;
            background: #e4edf2;
            border-radius: 999px;
            overflow: hidden;
            margin: 12px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #0f7c8a, #0e5f6c);
            transition: width 0.3s ease;
            width: 0%;
        }

        .run-controls { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
        .run-controls button { width: 100%; padding: 10px 12px; font-size: 0.9em; }

        .preset-buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        .preset-btn { padding: 6px 10px; font-size: 0.8em; }

        .param-group {
            background: #f4f8fa;
            border: 1px solid #d9e5ea;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .param-group-title {
            font-weight: 600;
            color: #3c5a67;
            margin-bottom: 8px;
            font-size: 0.85em;
        }

        .two-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .three-columns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3200;
        }

        .modal-content {
            background-color: #fff;
            padding: 16px;
            border-radius: 10px;
            width: min(92vw, 640px);
            max-height: 78vh;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            border: 1px solid #d9e5ea;
        }

        .modal-header {
            border-bottom: 1px solid #e2ebef;
            padding-bottom: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h4 { margin: 0; font-size: 1em; color: #2a4451; }

        .modal-close {
            border: none;
            background: none;
            font-size: 1.3em;
            cursor: pointer;
            color: #2f4d59;
            padding: 0 6px;
        }

        .modal-close:hover { color: var(--danger); transform: none; box-shadow: none; background: none; }

        .modal-path-container { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .modal-path-input { flex-grow: 1; padding: 6px 10px; }

        .modal-body {
            flex-grow: 1;
            overflow-y: auto;
            border: 1px solid #d3e1e7;
            border-radius: 8px;
            padding: 8px;
            background: #fcfefe;
        }

        .modal-footer { padding-top: 10px; margin-top: 10px; border-top: 1px solid #e2ebef; text-align: right; }

        .file-list { list-style-type: none; padding: 0; margin: 0; }

        .file-list li {
            padding: 7px 9px;
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9em;
            color: #2f4d59;
        }

        .file-list li:hover { background-color: #edf5f7; }
        .file-list .icon { width: 18px; text-align: center; }

        .tab-container { margin-bottom: 10px; }

        .tab-buttons {
            display: flex;
            gap: 6px;
            border-bottom: 1px solid #d4dfe4;
            margin-bottom: 12px;
            padding-bottom: 2px;
        }

        .tab-btn {
            padding: 8px 14px;
            background: transparent;
            border: 1px solid transparent;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            margin-bottom: -3px;
            font-weight: 600;
            color: #5d7380;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9em;
            box-shadow: none;
        }

        .tab-btn:hover {
            color: var(--primary);
            background: #eef6f8;
            transform: none;
        }

        .tab-btn.active {
            color: var(--primary);
            background: #eef6f8;
            border-color: #bcd2d9;
            border-bottom-color: #eef6f8;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .model-info {
            font-size: 0.82em;
            color: #506876;
            margin-top: 4px;
            padding: 7px 9px;
            background: #f3f8fa;
            border-radius: 8px;
            border: 1px solid #d7e5ea;
        }

        .pipeline-config {
            background: linear-gradient(180deg, #0f7c8a 0%, #0d6170 100%);
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            box-shadow: 0 8px 18px rgba(8, 44, 53, 0.25);
        }

        .pipeline-config h3 {
            color: #fff;
            border-bottom-color: rgba(255, 255, 255, 0.3);
            font-size: 0.92em;
        }

        .pipeline-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.16);
            border-radius: 8px;
            margin-bottom: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .pipeline-option input[type="checkbox"] { width: 16px; height: 16px; }
        .pipeline-option label { flex: 1; font-weight: 500; font-size: 0.85em; }

        .pipeline-option select {
            background: rgba(255, 255, 255, 0.95);
            border: none;
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 0.85em;
            color: #1f3d49;
        }

        .search-mode-selector { display: flex; gap: 8px; margin-bottom: 10px; }

        .search-mode-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid #cfdee4;
            border-radius: 10px;
            background: #fff;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(9, 41, 49, 0.06);
        }

        .search-mode-btn:hover {
            border-color: #9ec0cb;
            transform: translateY(-1px);
        }

        .search-mode-btn.active {
            border-color: var(--primary);
            background: #e6f2f4;
            box-shadow: inset 0 0 0 1px rgba(15, 124, 138, 0.12);
        }

        .search-mode-btn .mode-icon { font-size: 1.2em; display: block; margin-bottom: 4px; }
        .search-mode-btn .mode-name { font-weight: 600; font-size: 0.85em; color: #2b4a56; }

        .disabled-section { opacity: 0.52; pointer-events: none; }
        .disabled-section input, .disabled-section select, .disabled-section textarea { background-color: #edf2f5; }

        @media (max-width: 980px) {
            body {
                margin: 0;
                border-radius: 0;
                max-width: none;
                padding: 14px;
            }

            .main-container { flex-direction: column; }
            .control-panel { width: auto; min-width: 0; position: static; }
        }

        @media (max-width: 860px) { .three-columns { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 680px) { .two-columns, .three-columns { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <h1>🎬 视频处理流水线控制面板</h1>
    
    <div class="main-container">
        <!-- 左侧配置面板 -->
        <div class="config-panel">
            <!-- Tab切换 -->
            <div class="tab-container">
                <div class="tab-buttons">
                    <button class="tab-btn active" data-tab="indexer">📹 视频向量化</button>
                    <button class="tab-btn" data-tab="search">🔍 自动提纯</button>
                </div>
                
                <!-- 视频向量化 Tab -->
                <div id="tab-indexer" class="tab-content active">
                    <div class="panel-card">
                        <h3>📹 视频向量化</h3>
                        <!-- 路径配置 -->
                        <div class="form-group">
                            <label for="input_directory">输入目录</label>
                            <div class="input-group">
                                <input type="text" id="input_directory" value="" placeholder="视频文件夹">
                                <button type="button" class="browse-btn" data-target="input_directory" data-mode="folder">📁</button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="output_directory">输出目录</label>
                            <div class="input-group">
                                <input type="text" id="output_directory" value="indexes" placeholder="索引保存目录">
                                <button type="button" class="browse-btn" data-target="output_directory" data-mode="folder">📁</button>
                            </div>
                        </div>
                        <!-- 模型与性能参数 -->
                        <div class="three-columns">
                            <div class="form-group">
                                <label for="idx_model_name">模型</label>
                                <select id="idx_model_name">
                                    <option value="qihoo360_fg-clip2-base">qihoo360_fg-clip2-base</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="idx_model_type">类型</label>
                                <select id="idx_model_type">
                                    <option value="auto">auto</option>
                                    <option value="clip">clip</option>
                                    <option value="fgclip2">fgclip2</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="idx_output_resolution">分辨率</label>
                                <input type="number" id="idx_output_resolution" value="256" min="64" max="2048">
                            </div>
                        </div>
                        <div class="three-columns">
                            <div class="form-group">
                                <label for="idx_batch_size">Batch</label>
                                <input type="number" id="idx_batch_size" value="512" min="1" max="2048">
                            </div>
                            <div class="form-group">
                                <label for="idx_workers">写入线程</label>
                                <input type="number" id="idx_workers" value="2" min="1" max="8">
                            </div>
                            <div class="form-group">
                                <label for="idx_io_workers">IO Workers</label>
                                <input type="number" id="idx_io_workers" value="8" min="1" max="32">
                            </div>
                        </div>
                        <div class="three-columns">
                            <div class="form-group">
                                <label for="idx_sample_interval">采样间隔</label>
                                <input type="number" id="idx_sample_interval" value="3" min="1" max="30">
                            </div>
                            <div class="form-group">
                                <label for="idx_truncate_dim">向量维度</label>
                                <input type="text" id="idx_truncate_dim" value="" placeholder="默认">
                            </div>
                            <div class="form-group">
                                <label for="idx_cosine_threshold">相似度阈值</label>
                                <input type="number" id="idx_cosine_threshold" value="0.85" min="0.5" max="0.99" step="0.01">
                            </div>
                        </div>
                        <!-- 处理模式 -->
                        <div class="toggle-row">
                            <input type="checkbox" id="idx_resume_processing">
                            <label for="idx_resume_processing">增量处理</label>
                        </div>
                        <!-- 场景检测参数 -->
                        <div class="three-columns">
                            <div class="form-group">
                                <label for="idx_brightness_threshold">亮度阈值</label>
                                <input type="number" id="idx_brightness_threshold" value="15" min="0" max="255">
                            </div>
                            <div class="form-group">
                                <label for="idx_black_pixel_ratio">黑帧比例%</label>
                                <input type="number" id="idx_black_pixel_ratio" value="98" min="0" max="100">
                            </div>
                            <div class="form-group">
                                <label for="idx_min_scene_length">最小场景帧</label>
                                <input type="number" id="idx_min_scene_length" value="7" min="1" max="100">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="idx_localmax_order">局部最大值阶数</label>
                            <input type="number" id="idx_localmax_order" value="1" min="1" max="10">
                        </div>
                    </div>
                </div>
                
                <!-- 自动提纯 Tab -->
                <div id="tab-search" class="tab-content">
                    <div class="panel-card">
                        <h3>🔍 自动提纯</h3>
                        <!-- 搜索模式选择 -->
                        <div class="search-mode-selector" style="margin-bottom:10px;">
                            <div class="search-mode-btn active" data-mode="prompt">
                                <span class="mode-icon">🔍</span>
                                <span class="mode-name">Prompt模式</span>
                            </div>
                            <div class="search-mode-btn" data-mode="label">
                                <span class="mode-icon">🏷️</span>
                                <span class="mode-name">标签模式</span>
                            </div>
                            <div class="search-mode-btn" data-mode="cloze">
                                <span class="mode-icon">📝</span>
                                <span class="mode-name">选词填空</span>
                            </div>
                        </div>
                        <input type="hidden" id="search_entry_mode" value="prompt">
                        <!-- 路径配置 -->
                        <div class="two-columns">
                            <div class="form-group">
                                <label for="search_index_directory">索引目录</label>
                                <div class="input-group">
                                    <input type="text" id="search_index_directory" value="indexes">
                                    <button type="button" class="browse-btn" data-target="search_index_directory" data-mode="folder">📁</button>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="ps_video_output_directory">视频输出目录（可选）</label>
                                <div class="input-group">
                                    <input type="text" id="ps_video_output_directory" value="" placeholder="默认使用 output/videos">
                                    <button type="button" class="browse-btn" data-target="ps_video_output_directory" data-mode="folder">📁</button>
                                </div>
                            </div>
                        </div>
                        <!-- Prompt模板 -->
                        <div id="prompt-mode-section">
                            <div class="form-group">
                                <label for="ps_prompt_template">Prompt模板</label>
                                <textarea id="ps_prompt_template" rows="1" style="min-height:32px;">A {情绪} photo of a {主体} {动作} in {场景}.</textarea>
                            </div>
                            <div class="form-group">
                                <label for="video_name_format">命名格式</label>

                        el.style.opacity = enabled ? '' : '0.5';
                        el.style.backgroundColor = enabled ? '' : '#f0f0f0';
                    }
                });
            }
            
            if (mode === 'prompt') {
                // Prompt模式：启用Prompt专属和Reranker，禁用标签专属
                setElementsEnabled(promptOnlyElements, true);
                setElementsEnabled(rerankerElements, true);

        function setToggleVisualState(element, enabled) {
            if (!element) {
                return;
            }
            element.disabled = !enabled;
            element.style.opacity = enabled ? '' : '0.6';
        }

        function updateCopyAudioConflictControls(isCopyMode) {
            const copyKeepAudioEl = document.getElementById('ffmpeg_copy_keep_audio');
            const forceCleanEl = document.getElementById('ffmpeg_force_clean');
            if (!copyKeepAudioEl || !forceCleanEl) {
                return;
            }

            if (!isCopyMode) {
                setToggleVisualState(copyKeepAudioEl, false);
                setToggleVisualState(forceCleanEl, true);
                return;
            }

            if (copyKeepAudioEl.checked && forceCleanEl.checked) {
                copyKeepAudioEl.checked = false;
            }

            if (forceCleanEl.checked) {
                setToggleVisualState(forceCleanEl, true);
                setToggleVisualState(copyKeepAudioEl, false);
                return;
            }

            if (copyKeepAudioEl.checked) {
                setToggleVisualState(copyKeepAudioEl, true);
                setToggleVisualState(forceCleanEl, false);
                return;
            }

            setToggleVisualState(copyKeepAudioEl, true);
            setToggleVisualState(forceCleanEl, true);
        }

        function isNvencCodec(codec) {
            return String(codec || '').toLowerCase().includes('nvenc');
        }

        function updateHwaccelVideoCodecConstraint(isCopyMode) {
            const hwaccelEl = document.getElementById('ffmpeg_hwaccel');
            const videoCodecEl = document.getElementById('ffmpeg_video_codec');
            if (!hwaccelEl || !videoCodecEl) {
                return;
            }

            const cpuOnlyMode = hwaccelEl.value === 'none';
            const codecOptions = Array.from(videoCodecEl.querySelectorAll('option'));

            codecOptions.forEach(option => {
                const gpuCodec = isNvencCodec(option.value);
                option.disabled = cpuOnlyMode ? gpuCodec : false;
            });

            if (!isCopyMode && videoCodecEl.value) {
                if (isNvencCodec(videoCodecEl.value)) {
                    videoCodecEl.dataset.lastGpuCodec = videoCodecEl.value;
                } else {
                    videoCodecEl.dataset.lastCpuCodec = videoCodecEl.value;
                }
            }

            if (cpuOnlyMode && isNvencCodec(videoCodecEl.value)) {
                const preferredCpuCodec = videoCodecEl.dataset.lastCpuCodec || 'libx265';
                const preferredOption = videoCodecEl.querySelector(`option[value="${preferredCpuCodec}"]:not([disabled])`);
                if (preferredOption) {
                    videoCodecEl.value = preferredCpuCodec;
                } else {
                    const firstCpuOption = codecOptions.find(option => !option.disabled && !isNvencCodec(option.value));
                    if (firstCpuOption) {
                        videoCodecEl.value = firstCpuOption.value;
                    }
                }
            }
        }

        async function fetchAndDisplayPath(path = '') {
            fileList.innerHTML = '<li>正在加载...</li>';
            try {
                const res = await fetch(`/browse?path=${encodeURIComponent(path)}`);
                const data = await res.json();
                if (!res.ok) { fileList.innerHTML = `<li style="color: red;">错误: ${data.error}</li>`; return; }
                
                modalPathInput.value = data.current_path;
                fileList.innerHTML = '';
                
                if (data.parent_path) {
                    const li = document.createElement('li');
                    li.innerHTML = `<span class="icon">⬆️</span> .. (父文件夹)`;
                    li.onclick = () => fetchAndDisplayPath(data.parent_path);
                    fileList.appendChild(li);
                }
                
                data.dirs.forEach(dir => {
                    const fullPath = data.current_path + (data.current_path.endsWith('\\') || data.current_path.endsWith('/') ? '' : '\\') + dir;
                    const li = document.createElement('li');
                    li.innerHTML = `<span class="icon">📁</span> ${dir}`;
                    li.onclick = () => fetchAndDisplayPath(fullPath);
                    fileList.appendChild(li);
                });
                
                data.files.forEach(file => {
                    const li = document.createElement('li');
                    li.innerHTML = `<span class="icon">📄</span> ${file}`;
                    li.style.color = '#888';
                    fileList.appendChild(li);
                });
                
                selectCurrentFolderBtn.onclick = () => {
                    if (currentTargetInput) currentTargetInput.value = data.current_path;
                    hideModal();
                };
            } catch (err) {
                fileList.innerHTML = `<li style="color: red;">无法连接到后端。</li>`;
            }
        }
        
        modalGoBtn.addEventListener('click', () => fetchAndDisplayPath(modalPathInput.value));
        modalPathInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); fetchAndDisplayPath(modalPathInput.value); } });

                    video_codec: document.getElementById('ffmpeg_video_codec').value,
                    hwaccel: document.getElementById('ffmpeg_hwaccel').value,
                    gpu_device: parseInt(document.getElementById('ffmpeg_gpu_device').value),
                    crf: parseInt(document.getElementById('ffmpeg_crf').value),
                    preset: document.getElementById('ffmpeg_preset').value,
                    audio_codec: isCopyMode
                        ? (copyKeepAudio ? 'copy' : 'none')
                        : document.getElementById('ffmpeg_audio_codec').value,
                    audio_bitrate: document.getElementById('ffmpeg_audio_bitrate').value,
                    force_clean: document.getElementById('ffmpeg_force_clean').checked,
                    pixel_format: document.getElementById('ffmpeg_pixel_format').value,
                    movflags: document.getElementById('ffmpeg_movflags').value,
                    nvenc: {
                        rc_mode: document.getElementById('nvenc_rc_mode').value,
                        spatial_aq: document.getElementById('nvenc_spatial_aq').checked,
                        temporal_aq: document.getElementById('nvenc_temporal_aq').checked,
                        rc_lookahead: parseInt(document.getElementById('nvenc_rc_lookahead').value),
                        qmin_offset: parseInt(document.getElementById('nvenc_qmin_offset').value),
                        qmax_offset: parseInt(document.getElementById('nvenc_qmax_offset').value)
                    }
                }
            };
        }

        async function saveFfmpegConfig() {
            const ffmpegConfig = collectFfmpegConfig();
            const response = await fetch('/save_ffmpeg_config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(ffmpegConfig)
            });
            const data = await response.json();
            if (!response.ok || !data.success) {
                throw new Error(data.message || data.error || '写入 FFmpeg 参数失败');
            }
        }

        async function saveSimilarityConfig() {
            const payload = {
                similarity_thresholds: {
                    clip_large: parseFloat(document.getElementById('sim_clip_large').value),
                    fgclip2: parseFloat(document.getElementById('sim_fgclip2').value),
                    reranker: parseFloat(document.getElementById('sim_reranker').value),
                    reranker_weight: parseFloat(document.getElementById('sim_reranker_weight').value)
                }
            };
            const response = await fetch('/save_similarity_config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            if (!response.ok || !data.success) {
                throw new Error(data.message || data.error || '写入相似度阈值失败');
            }
        }

        function pickDefined(...values) {
            for (const value of values) {
                if (value !== undefined && value !== null) {
                    return value;
                }
            }
            return undefined;
        }

        function setInputValue(id, value) {
            const element = document.getElementById(id);
            if (!element || value === undefined) {
                return;
            }
            if (element.type === 'checkbox') {
                element.checked = Boolean(value);
            } else {
                element.value = value === null ? '' : String(value);
            }
        }

        function updateDefaultPresetInfo(defaultPresetName) {
            presetDefaultInfo.textContent = defaultPresetName
                ? `默认预设：${defaultPresetName}`
                : '默认预设：未设置';
        }

        function renderPresetOptions(presets, selectedName = '') {
            presetSelect.innerHTML = '<option value="">-- 无 --</option>';
            presets.forEach(name => {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                presetSelect.appendChild(option);
            });
            if (selectedName && presets.includes(selectedName)) {
                presetSelect.value = selectedName;
            }
        }

        function collectPresetData() {
            return {
                version: 1,
                pipeline_config: collectConfig(),
                ffmpeg_config: collectFfmpegConfig(),
                similarity_thresholds: {
                    clip_large: parseFloat(document.getElementById('sim_clip_large').value),
                    fgclip2: parseFloat(document.getElementById('sim_fgclip2').value),
                    reranker: parseFloat(document.getElementById('sim_reranker').value),
                    reranker_weight: parseFloat(document.getElementById('sim_reranker_weight').value)
                }
            };
        }

        function applyPresetData(presetData) {
            if (!presetData || typeof presetData !== 'object') {
                return;
            }

            const config = presetData.pipeline_config || presetData.config || {};
            const indexerConfig = config.indexer || {};
            const promptConfig = config.prompt_search || {};
            const labelConfig = config.label_search || {};
            const clozeConfig = config.cloze_search || {};

            setInputValue('run_indexer', config.run_indexer);
            setInputValue('run_search', config.run_search);

            setInputValue('input_directory', indexerConfig.input_directory);
            setInputValue('output_directory', indexerConfig.output_directory);
            setInputValue('idx_model_name', indexerConfig.model_name);
            setInputValue('idx_model_type', indexerConfig.model_type);
            setInputValue('idx_truncate_dim', indexerConfig.truncate_dim);
            setInputValue('idx_output_resolution', indexerConfig.output_resolution);
            setInputValue('idx_batch_size', indexerConfig.batch_size);
            setInputValue('idx_workers', indexerConfig.workers);
            setInputValue('idx_io_workers', indexerConfig.io_workers);
            setInputValue('idx_cosine_threshold', indexerConfig.cosine_similarity_threshold);
            setInputValue('idx_brightness_threshold', indexerConfig.brightness_threshold);
            setInputValue('idx_black_pixel_ratio', indexerConfig.black_pixel_ratio);
            setInputValue('idx_sample_interval', indexerConfig.sample_interval);
            setInputValue('idx_min_scene_length', indexerConfig.min_scene_length);
            setInputValue('idx_localmax_order', indexerConfig.localmax_order);
            setInputValue('idx_resume_processing', indexerConfig.resume_processing);

            const searchEntryMode = pickDefined(config.search_entry_mode, 'prompt');
            updateSearchMode(searchEntryMode);

            setInputValue('search_index_directory', pickDefined(
                promptConfig.index_directory,
                labelConfig.index_directory,
                clozeConfig.index_directory
            ));
            setInputValue('ps_video_output_directory', pickDefined(
                promptConfig.video_output_directory,
                labelConfig.video_output_directory,
                clozeConfig.video_output_directory
            ));
            setInputValue('ps_prompt_template', promptConfig.prompt_template);
            setInputValue('video_name_format', pickDefined(
                promptConfig.video_name_format,
                labelConfig.video_name_format,
                clozeConfig.video_name_format
            ));
            setInputValue('start_offset', pickDefined(
                promptConfig.start_frame_offset,
                labelConfig.start_frame_offset,
                clozeConfig.start_frame_offset
            ));
            setInputValue('end_offset', pickDefined(
                promptConfig.end_frame_offset,
                labelConfig.end_frame_offset,
                clozeConfig.end_frame_offset
            ));
            setInputValue('ps_prompt_search_batch', pickDefined(
                promptConfig.prompt_search_batch_size,
                clozeConfig.prompt_search_batch_size
            ));
            setInputValue('ls_text_batch_size', labelConfig.prompt_search_batch_size);
            setInputValue('search_mode_select', pickDefined(
                promptConfig.search_mode,
                labelConfig.search_mode,
                clozeConfig.search_mode
            ));
            setInputValue('candidate_batch_size', pickDefined(
                promptConfig.candidate_batch_size,
                labelConfig.candidate_batch_size,
                clozeConfig.candidate_batch_size
            ));
            setInputValue('ps_pkl_batch_size', pickDefined(
                promptConfig.pkl_batch_size,
                labelConfig.pkl_batch_size,
                clozeConfig.pkl_batch_size
            ));
            setInputValue('ps_top_k', pickDefined(
                promptConfig.top_k,
                labelConfig.top_k,
                clozeConfig.top_k
            ));
            setInputValue('ps_pkl_load_workers', pickDefined(
                promptConfig.pkl_load_workers,
                labelConfig.pkl_load_workers,
                clozeConfig.pkl_load_workers
            ));
            setInputValue('ps_prompt_cache_batch', pickDefined(
                promptConfig.prompt_cache_batch_size,
                labelConfig.label_cache_batch_size,
                clozeConfig.prompt_cache_batch_size
            ));
            setInputValue('ps_lmdb_write_batch_size', pickDefined(
                promptConfig.lmdb_write_batch_size,
                labelConfig.lmdb_write_batch_size,
                clozeConfig.lmdb_write_batch_size
            ));
            setInputValue('ps_vector_dedup_threshold', pickDefined(
                promptConfig.vector_dedup_threshold,
                labelConfig.vector_dedup_threshold,
                clozeConfig.vector_dedup_threshold
            ));
            setInputValue('ps_adjacent_merge_frames', pickDefined(
                promptConfig.adjacent_merge_frames,
                labelConfig.adjacent_merge_frames,
                clozeConfig.adjacent_merge_frames
            ));

            setInputValue('ps_use_reranker', pickDefined(promptConfig.use_reranker, clozeConfig.use_reranker));
            setInputValue('use_diskcache', pickDefined(promptConfig.use_diskcache, labelConfig.use_diskcache, clozeConfig.use_diskcache));
            setInputValue('ps_use_fp16', promptConfig.use_fp16);
            setInputValue('ps_feature_fp16', promptConfig.feature_fp16);
            setInputValue('ps_use_chinese_query', pickDefined(promptConfig.use_chinese, labelConfig.use_chinese_labels, clozeConfig.use_chinese));
            setInputValue('debug_similarity', pickDefined(promptConfig.debug_similarity, labelConfig.debug_similarity, clozeConfig.debug_similarity));
            setInputValue('ps_rerank_top_k', pickDefined(promptConfig.rerank_top_k, clozeConfig.rerank_top_k));
            setInputValue('ps_rerank_batch_size', pickDefined(promptConfig.rerank_batch_size, clozeConfig.rerank_batch_size));
            setInputValue('ps_reranker_resolution', pickDefined(promptConfig.reranker_output_resolution, clozeConfig.reranker_output_resolution));

            const copyMode = pickDefined(promptConfig.video_copy_mode, labelConfig.video_copy_mode, clozeConfig.video_copy_mode);
            if (copyMode !== undefined) {
                document.getElementById(copyMode ? 'export_copy' : 'export_precise').checked = true;
            }

            const ffmpegConfig = presetData.ffmpeg_config || {};
            const videoOutputConfig = ffmpegConfig.video_output || {};
            setInputValue('ffmpeg_video_codec', videoOutputConfig.video_codec);
            setInputValue('ffmpeg_hwaccel', videoOutputConfig.hwaccel);
            setInputValue('ffmpeg_gpu_device', videoOutputConfig.gpu_device);
            setInputValue('ffmpeg_crf', videoOutputConfig.crf);
            setInputValue('ffmpeg_preset', videoOutputConfig.preset);
            const audioCodecValue = pickDefined(videoOutputConfig.audio_codec, '');
            const ffmpegAudioCodecEl = document.getElementById('ffmpeg_audio_codec');
            if (ffmpegAudioCodecEl && audioCodecValue && videoOutputConfig.copy_mode !== true && audioCodecValue !== 'copy'
                && ffmpegAudioCodecEl.querySelector(`option[value="${audioCodecValue}"]`)) {
                setInputValue('ffmpeg_audio_codec', audioCodecValue);
            }
            const ffmpegCopyKeepAudioEl = document.getElementById('ffmpeg_copy_keep_audio');
            if (ffmpegCopyKeepAudioEl && videoOutputConfig.copy_mode === true && audioCodecValue) {
                ffmpegCopyKeepAudioEl.checked = (audioCodecValue === 'copy');
            }
            setInputValue('ffmpeg_audio_bitrate', videoOutputConfig.audio_bitrate);
            setInputValue('ffmpeg_force_clean', videoOutputConfig.force_clean);
            setInputValue('ffmpeg_pixel_format', videoOutputConfig.pixel_format);
            setInputValue('ffmpeg_movflags', videoOutputConfig.movflags);
            // NVENC 高级参数
            const nvencConfig = videoOutputConfig.nvenc || {};
            setInputValue('nvenc_rc_mode', nvencConfig.rc_mode);
            setInputValue('nvenc_spatial_aq', nvencConfig.spatial_aq);
            setInputValue('nvenc_temporal_aq', nvencConfig.temporal_aq);
            setInputValue('nvenc_rc_lookahead', nvencConfig.rc_lookahead);
            setInputValue('nvenc_qmin_offset', nvencConfig.qmin_offset);
            setInputValue('nvenc_qmax_offset', nvencConfig.qmax_offset);
            if (videoOutputConfig.copy_mode !== undefined) {
                document.getElementById(videoOutputConfig.copy_mode ? 'export_copy' : 'export_precise').checked = true;
            }

            // 相似度阈值
            const simConfig = presetData.similarity_thresholds || {};
            setInputValue('sim_clip_large', simConfig.clip_large);
            setInputValue('sim_fgclip2', simConfig.fgclip2);
            setInputValue('sim_reranker', simConfig.reranker);
            setInputValue('sim_reranker_weight', simConfig.reranker_weight);

            updateSearchModeSelect();
            updateRerankerParams();
            updateExportModeControls();
        }

        async function refreshPresetList(preferredName = '') {
            const response = await fetch('/list_presets');
            const data = await response.json();
            if (!response.ok || !data.success) {
                throw new Error(data.message || data.error || '读取预设列表失败');
            }
            renderPresetOptions(data.presets || [], preferredName || data.default_preset || '');
            updateDefaultPresetInfo(data.default_preset);
            return data;
        }

        async function loadPresetByName(name, silent = false) {
            if (!name) {
                throw new Error('请先选择预设');
            }
            const response = await fetch(`/load_preset?name=${encodeURIComponent(name)}`);
            const data = await response.json();
            if (!response.ok || !data.success) {
                throw new Error(data.message || data.error || '加载预设失败');
            }
            applyPresetData(data.data || {});
            presetSelect.value = data.name || name;
            presetNameInput.value = data.name || name;
            if (!silent) {
                statusDiv.className = 'status-box success';
                statusDiv.textContent = `✅ 已加载预设: ${data.name || name}`;
            }
        }

        async function savePreset() {
            const presetName = (presetNameInput.value || presetSelect.value || '').trim();
            if (!presetName) {
                statusDiv.className = 'status-box error';
                statusDiv.textContent = '❌ 请先输入预设名称';
                return;
            }
            try {
                const response = await fetch('/save_preset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: presetName,
                        data: collectPresetData(),
                        set_as_default: presetSetDefaultCheckbox.checked
                    })
                });
                const data = await response.json();
                if (!response.ok || !data.success) {
                    throw new Error(data.message || data.error || '保存预设失败');
                }
                const savedName = data.name || presetName;
                await refreshPresetList(savedName);
                presetNameInput.value = savedName;
                statusDiv.className = 'status-box success';
                statusDiv.textContent = `✅ 预设已保存: ${savedName}`;
            } catch (error) {
                statusDiv.className = 'status-box error';
                statusDiv.textContent = '❌ 保存预设失败: ' + error.message;
            }
        }

        async function loadSelectedPreset() {
            try {
                await loadPresetByName(presetSelect.value);
            } catch (error) {
                statusDiv.className = 'status-box error';
                statusDiv.textContent = '❌ 加载预设失败: ' + error.message;
            }
        }

        async function setDefaultPreset() {
            const presetName = presetSelect.value;
            if (!presetName) {
                return;
            }
            try {
                const response = await fetch('/set_default_preset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: presetName })
                });
                const data = await response.json();
                if (!response.ok || !data.success) {
                    throw new Error(data.message || data.error || '设置默认预设失败');
                }
                updateDefaultPresetInfo(data.default_preset);
                statusDiv.className = 'status-box success';
                statusDiv.textContent = `✅ 默认预设已设置为: ${presetName}`;
            } catch (error) {
                statusDiv.className = 'status-box error';
                statusDiv.textContent = '❌ 设置默认预设失败: ' + error.message;
            }
        }

        async function initPresets() {
            const data = await refreshPresetList();
            if (data.default_preset) {
                await loadPresetByName(data.default_preset, true);
                statusDiv.className = 'status-box';
                statusDiv.textContent = `🧩 已加载默认预设: ${data.default_preset}`;
            }
        }
        
        // ============ 更新UI状态 ============
        async function loadModelList() {
            try {
                const response = await fetch('/list_models');
                const data = await response.json();
                if (data.success && data.models.length > 0) {
                    const select = document.getElementById('idx_model_name');
                    const currentValue = select.value;
                    select.innerHTML = '';
                    data.models.forEach(model => {
                        const option = document.createElement('option');
                        option.value = model.name;
                        option.textContent = `${model.name} (${model.type})`;
                        select.appendChild(option);
                    });
                    if (currentValue) {
                        select.value = currentValue;
                    }
                }
            } catch (error) {
                console.error('加载模型列表失败:', error);
            }
        }
        
        // ============ 事件绑定 ============
        // ============ 运行状态（覆盖乱码版本） ============
        // ============ Runtime Controls ============
        function setRunningState(running) {
            isRunning = running;
            runPipelineBtn.disabled = running;
            stopBtn.disabled = !running;
            if (running) {
                statusDiv.className = 'status-box running';
                statusDiv.textContent = 'Running...';
            }
        }

        async function runPipeline() {
            if (isRunning) return;
            const config = collectConfig();

            if (!config.run_indexer && !config.run_search) {
                statusDiv.className = 'status-box error';
                statusDiv.textContent = 'ERROR: Please select at least one step (index/search).';
                return;
            }

            try {
                statusDiv.className = 'status-box running';
                if (config.run_search) {
                    statusDiv.textContent = 'Saving FFmpeg config...';
                    await saveFfmpegConfig();
                    statusDiv.textContent = 'Saving similarity config...';
                    await saveSimilarityConfig();
                } else {
                    statusDiv.textContent = 'Preparing (index only)...';
                }

                isStopping = false;
                sseErrorCount = 0;
                if (eventSource) {
                    try { eventSource.close(); } catch (e) {}
                    eventSource = null;
                }

                setRunningState(true);
                progressFill.style.width = '0%';
                eventSource = new EventSource(`/run_pipeline_stream?config=${encodeURIComponent(JSON.stringify(config))}`);

                eventSource.onmessage = function(event) {
                    const data = JSON.parse(event.data);
                    if (data.type === 'heartbeat') {
                        // 心跳消息，重置错误计数
                        sseErrorCount = 0;
                        return;
                    } else if (data.type === 'progress') {
                        sseErrorCount = 0;
                        progressFill.style.width = data.percent + '%';
                    } else if (data.type === 'status') {
                        sseErrorCount = 0;
                        statusDiv.textContent = data.message;
                    } else if (data.type === 'complete') {
                        isStopping = false;
                        setRunningState(false);
                        if (data.success) {
                            statusDiv.className = 'status-box success';
                            statusDiv.textContent = 'SUCCESS: ' + data.message;
                            progressFill.style.width = '100%';
                        } else {
                            statusDiv.className = 'status-box error';
                            statusDiv.textContent = 'ERROR: ' + data.message;
                        }
                        if (eventSource) {
                            eventSource.close();
                            eventSource = null;
                        }
                    }
                };

                eventSource.onerror = function() {
                    if (isStopping) return;
                    sseErrorCount++;
                    console.warn(`SSE connection error (${sseErrorCount}/${SSE_MAX_RETRIES})`);
                    
                    // 未达到重试上限时，让 EventSource 自动重连
                    if (sseErrorCount < SSE_MAX_RETRIES) {
                        statusDiv.textContent = `连接波动，正在重连 (${sseErrorCount}/${SSE_MAX_RETRIES})...`;
                        return;
                    }
                    
                    // 达到上限，真正断开
                    isStopping = false;
                    setRunningState(false);
                    statusDiv.className = 'status-box error';
                    statusDiv.textContent = 'ERROR: Connection lost after multiple retries.';
                    if (eventSource) {
                        eventSource.close();
                        eventSource = null;
                    }
                };
            } catch (error) {
                isStopping = false;
                setRunningState(false);
                statusDiv.className = 'status-box error';
                statusDiv.textContent = 'ERROR: Run failed - ' + error.message;
            }
        }

        async function stopPipeline() {
            if (!isRunning && !eventSource) return;

            isStopping = true;
            setRunningState(false);
            statusDiv.className = 'status-box running';
            statusDiv.textContent = 'Stop request sent...';

            if (eventSource) {
                eventSource.onmessage = null;
                eventSource.onerror = null;
                eventSource.close();
                eventSource = null;
            }

            try {
                await fetch('/stop_pipeline', { method: 'POST' });
                statusDiv.className = 'status-box success';
                statusDiv.textContent = 'Stopped. Ready to run again.';
            } catch (error) {
                statusDiv.className = 'status-box error';
                statusDiv.textContent = 'ERROR: Force stop failed - ' + error.message;
            } finally {
                setRunningState(false);
                isStopping = false;
            }
        }

        runPipelineBtn.addEventListener('click', () => runPipeline());
        stopBtn.addEventListener('click', stopPipeline);
        savePresetBtn.addEventListener('click', savePreset);
        loadPresetBtn.addEventListener('click', loadSelectedPreset);
        setDefaultPresetBtn.addEventListener('click', setDefaultPreset);
        presetSelect.addEventListener('change', () => {
            if (presetSelect.value) {
                presetNameInput.value = presetSelect.value;
            }
        });
        
        // ============ 页面加载时获取模型列表 ============
        document.addEventListener('DOMContentLoaded', async () => {
            // 初始化搜索模式（默认prompt模式，禁用标签Batch）
            updateSearchMode('prompt');
            // 初始化搜索模式下拉框联动
            updateSearchModeSelect();
            updateExportModeControls();
            
            try {
                await loadModelList();
                await initPresets();
            } catch (error) {
                console.error('初始化页面配置失败:', error);
            }
        });
    </script>
</body>
